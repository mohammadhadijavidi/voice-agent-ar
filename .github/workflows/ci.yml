name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: CLI smoke test (simulated Twilio calls, mock providers, WhatsApp/SMS dry-run)
        run: |
          voice-agent-ar --version
          voice-agent-ar scenarios
          voice-agent-ar say "حجزك الساعة 20:30 لـ 4 أشخاص"
          voice-agent-ar simulate all
