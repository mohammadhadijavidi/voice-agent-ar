[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-agent-ar"
version = "0.1.0"
description = "Arabic AI phone agent for UAE restaurants and clinics: Gulf-dialect conversation over Twilio Media Streams (STT, LLM, TTS), spoken Arabic numbers and times, UAE phone formats, and booking confirmations by WhatsApp template or SMS."
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Mohammad Hadi Javidi" }]
keywords = ["arabic voice agent", "ai phone agent", "gulf arabic", "emirati dialect", "twilio", "media streams",
            "restaurant booking", "clinic appointment", "whatsapp", "uae", "dubai", "speech to text", "text to speech"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Arabic",
  "Framework :: FastAPI",
  "Topic :: Communications :: Telephony",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.35",
  "websockets>=13",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
voice-agent-ar = "voice_agent_ar.cli:main"

[project.urls]
Homepage = "https://github.com/mohammadhadijavidi/voice-agent-ar"
Issues = "https://github.com/mohammadhadijavidi/voice-agent-ar/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
voice_agent_ar = ["profiles/*.yaml", "scenarios/*.yaml", "static/*", "static/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
